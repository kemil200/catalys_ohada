[project]
name = "catalys_ohada"
description = "Referentiel comptable SYSCOHADA revise — module C-ERP"
authors = [{ name = "Catalys", email = "contact@catalys.tg" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
